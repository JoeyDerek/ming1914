<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="大明1914：从北京陷落到一次世界大战的架空历史 wiki">
    <title>大明1914</title>
    <style>
      :root {
        --accent: #8f2f24;
        --accent-soft: #f5e9e6;
        --border: #e2ded9;
        --ink: #27211f;
        --muted: #6f6560;
        --paper: #fffdf9;
        --sidebar: #f7f3ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
        line-height: 1.7;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
        padding: 24px 18px;
      }

      .brand {
        display: block;
        margin-bottom: 4px;
        color: var(--ink);
        font-size: 24px;
        font-weight: 750;
      }

      .tagline {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13px;
      }

      .search {
        width: 100%;
        height: 38px;
        margin-bottom: 18px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        padding: 0 10px;
        font: inherit;
      }

      .nav-list {
        display: grid;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav-section {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .nav-link {
        display: block;
        border-radius: 6px;
        padding: 6px 8px;
        color: var(--ink);
        font-size: 14px;
      }

      .nav-link.child {
        padding-left: 20px;
      }

      .nav-link.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
      }

      .content {
        width: min(920px, 100%);
        padding: 48px 42px 80px;
      }

      .content h1,
      .content h2,
      .content h3 {
        letter-spacing: 0;
        line-height: 1.3;
      }

      .content h1 {
        margin: 0 0 24px;
        font-size: 38px;
      }

      .content h2 {
        margin-top: 36px;
        border-top: 1px solid var(--border);
        padding-top: 24px;
        font-size: 24px;
      }

      .content h3 {
        margin-top: 28px;
        font-size: 19px;
      }

      .content p,
      .content ul,
      .content ol {
        font-size: 16px;
      }

      .content li + li {
        margin-top: 4px;
      }

      .content code {
        border-radius: 4px;
        background: #f0ece7;
        padding: 2px 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
      }

      .loading,
      .error {
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .layout {
          display: block;
        }

        .sidebar {
          position: relative;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .content {
          padding: 32px 20px 60px;
        }

        .content h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <a class="brand" href="#/home.md">大明1914</a>
        <p class="tagline">从北京陷落到一次世界大战</p>
        <input class="search" id="search" type="search" placeholder="搜索条目">
        <nav id="sidebar" aria-label="Wiki 导航"></nav>
      </aside>
      <main class="content" id="content">
        <p class="loading">正在载入大明1914...</p>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
